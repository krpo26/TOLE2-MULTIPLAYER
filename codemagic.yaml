# Sin probar: el primer build puede necesitar ajustes.
workflows:
  android-apk:
    name: Android APK (Godot)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      vars:
        GODOT_VERSION: "4.3"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Instalar Godot y plantillas
        script: |
          cd /tmp
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip
          curl -sL -o tpl.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -oq godot.zip
          TPL="$HOME/Library/Application Support/Godot/export_templates"
          mkdir -p "$TPL"
          unzip -oq tpl.tpz
          rm -rf "$TPL/${GODOT_VERSION}.stable"
          mv templates "$TPL/${GODOT_VERSION}.stable"
      - name: Instalar Android SDK propio
        script: |
          SDK="$HOME/android-sdk"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version 2>&1 || true
          mkdir -p "$SDK/cmdline-tools"
          cd /tmp
          curl -sL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip
          unzip -oq cmdtools.zip
          rm -rf "$SDK/cmdline-tools/latest"
          mv cmdline-tools "$SDK/cmdline-tools/latest"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SM" --sdk_root="$SDK" "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          echo "--- instalado ---"
          ls "$SDK" "$SDK/build-tools" "$SDK/platforms" "$SDK/platform-tools" | head -40
          "$SDK/platform-tools/adb" start-server || true
      - name: Configurar Godot para Android
        script: |
          SDK="$HOME/android-sdk"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore /tmp/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          CFG="$HOME/Library/Application Support/Godot"
          mkdir -p "$CFG"
          cat > "$CFG/editor_settings-${GODOT_VERSION}.tres" <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${SDK}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "/tmp/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          cat "$CFG/editor_settings-${GODOT_VERSION}.tres"
      - name: Importar proyecto y exportar APK
        script: |
          GODOT=/tmp/Godot.app/Contents/MacOS/Godot
          $GODOT --headless --path . --import || true
          mkdir -p build
          $GODOT --headless --verbose --path . --export-debug "Android" build/juego.apk
    artifacts:
      - build/*.apk
